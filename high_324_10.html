<body class="cmass-content">
    <section class="cm_wrap_h">
        <section>
            <div class="cm_title_bg">

            <div class="cm_txt" tabindex="0">

            <div class="cm_txt_bold" tabindex="0"><span class="cm_bull"></span>실행 결과</div>
            <div class="cm_code_white" tabindex="0">
                <pre class="cm_code2">10
9

1
출발!</pre>

        <section>
            <div class="cm_title_bg2">
                <h2 class="cm_title_h2" tabindex="0">1. 프로그래밍</h2>
            </div>
    
            <div class="cm_txt_h" tabindex="0">코드를 보고 빈칸을 채워 프로그램을 완성해 보자.</div>
            <div class="cm_hint_container">
                <button class="cm_hint_header" tabindex="0">
                    Hint<span class="cm_hint_sub">숫자를 카운트다운하며 출력하는 방법</span>
                </button>
                <div class="cm_hint_content">
                    <div class="cm_code_number" tabindex="0">
                        <div class="cm_line_count" aria-label="코드 라인 번호"><span>2</span></div>
                        <pre class="cm_code3" tabindex="0">while n > 0:</pre>
                        <div class="cm_line_count" aria-label="코드 라인 번호"><span>3</span></div>
                        <pre class="cm_code3" tabindex="0">    print(n)</pre>

<!-- 통합된 스크립트 최종! (0721 반영) -->
<script>
    (function() {
        // iframe 내부에서 실행 중인지 확인
        const isInIframe = window.self !== window.top;
        
        function initializeHints() {
            const hintHeaders = document.querySelectorAll('.cm_hint_header');
            
            // 각 힌트 헤더 초기화
            hintHeaders.forEach(header => {
                // 접근성 속성 설정 (첫 번째 스크립트에서 가져옴)
                header.setAttribute("role", "button");
                header.setAttribute("tabindex", "0");
                header.setAttribute("aria-expanded", "false");
                
                // 초기 상태 설정 (클래스와 스타일 모두 초기화)
                const content = header.nextElementSibling;
                if (content && content.classList.contains('cm_hint_content')) {
                    header.classList.remove('active');  // 클래스도 확실히 제거
                    content.style.maxHeight = '0';
                }
                
                // 이벤트 리스너 등록
                header.removeEventListener('click', handleHintClick);
                header.addEventListener('click', handleHintClick);
                
                // 키보드 이벤트 리스너 추가 (첫 번째 스크립트에서 가져옴)
                header.removeEventListener('keydown', handleKeydown);
                header.addEventListener('keydown', handleKeydown);
            });
    
            // 여기서 ResizeObserver 설정
            const ro = new ResizeObserver(entries => {
                for (let entry of entries) {
                    const el = entry.target;
                    // active 상태인 힌트만 조정
                    const header = el.previousElementSibling;
                    if (header && header.classList.contains('active')) {
                        el.style.maxHeight = el.scrollHeight + 'px';
                    }
                }
            });
    
            document.querySelectorAll('.cm_hint_content').forEach(content => {
                ro.observe(content);
            });
        }
        
        // 클릭 이벤트 처리
        function handleHintClick(e) {
            e.preventDefault();
            e.stopPropagation();
            toggleHint.call(this);
        }
        
        // 키보드 이벤트 처리 (첫 번째 스크립트에서 가져옴)
        function handleKeydown(e) {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                toggleHint.call(this);
            }
        }
        
        // 힌트 토글 함수 (통합 버전)
        function toggleHint() {
            const header = this;
            const content = header.nextElementSibling;
            
            if (!content || !content.classList.contains('cm_hint_content')) return;
            
            // 현재 상태 확인
            const isExpanded = header.classList.contains('active');
            
            if (isExpanded) {
                // 닫기
                header.classList.remove('active');
                header.setAttribute("aria-expanded", "false");
                header.setAttribute('aria-label', '힌트 닫힘');
                content.style.maxHeight = '0';
            } else {
                // 열기  
                header.classList.add('active');
                header.setAttribute("aria-expanded", "true");
                header.setAttribute('aria-label', '힌트 열림');
                content.style.maxHeight = content.scrollHeight + 'px';
            }
        }
        
        // DOM이 완전히 로드된 후 실행
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeHints);
        } else {
            initializeHints();
        }
        
    })();
</script>
</body>
</html>
